load:
  max_unmatched_share: 0.001
gate:
  drop_analyst: true
  drop_not_market_news: true
  drop_skipped: true
  analyst_value: analyst_opinion
  not_market_value: not_market_news
  skipped_value: skipped
  ok_value: ok
entity:
  link_types:
  - industry
  - corr
  - owner
timing:
  date_only_hour_utc: 0
dedupe:
  key_chars: 120
  window_sessions: 3
  min_key_chars: 20
repeat_weight:
  base: 1.0
trust:
  clip_low: 0.2
  clip_high: 2.0
  min_pins: 30
  default: 1.0
direction:
  up: 1
  down: -1
  none: 0
  mixed: 0
causes:
  other_value: other
  no_cause_group: no_cause
touch:
  themes_on_company_events: false
  market_themes:
  - rates_fed
  - banking_credit
  - health_covid
  - trade_policy
  - russia_ukraine
  themes:
    oil_energy: opec|crude|brent|\bwti\b|oil price|natural gas|\blng\b|pipeline|refiner
    metals_mining: \bgold\b|copper|steel|alumin|iron ore|lithium|nickel|mining
    agri_food: wheat|\bcorn\b|soybean|grain|fertili[sz]er|food price|\bcrop|drought
    china_asia: \bchina\b|chinese|beijing|hong kong|taiwan|\bjapan\b|\bkorea
    russia_ukraine: russia|ukrain|putin|kremlin|moscow
    middle_east: \biran\b|israel|gaza|saudi|middle east|yemen|red sea|houthi
    europe: \beurope|\becb\b|\beu\b|brexit|britain|germany
    trade_policy: \btariffs?\b|trade war|export ban|export control|sanction|embargo|import
      dut
    rates_fed: \bfed\b|federal reserve|rate hike|rate cut|interest rate|inflation|\bcpi\b|powell|treasury
      yield|jobs report|payroll
    health_covid: covid|coronavirus|pandemic|lockdown|vaccine|omicron
    supply_chain: supply chain|shortage|port congestion|chip shortage|\bstrike
    banking_credit: bank run|banking crisis|\bsvb\b|silicon valley bank|credit suisse|\bdefault|bankruptc|debt
      ceiling
    disaster_weather: hurricane|earthquake|wildfire|flood|typhoon
sector:
  enabled: true
  clusters: 12
  svd_components: 8
  seed: 0
  kmeans_n_init: 10
  confidence_cut: 0.35
  min_class_pins: 25
  tfidf:
    ngram_min: 1
    ngram_max: 2
    min_df: 3
    max_features: 100000
  logistic:
    c: 3.0
    max_iter: 300
  min_returns_days: 100
returns:
  scale: 100.0
placeholders:
  use_direction_finbert: false
  use_world_themes_embed: false
  use_cause_repair_embed: false
  cache_dir: outputs/nlp-checks
  finbert_file: finbert_scores.parquet
  embeddings_file: embeddings_units.npy
  embedding_ids_file: embeddings_unit_ids.parquet
  finbert_neutral_band: 0.05
  neighbours_k: 10
  chunk_rows: 2000
  neighbour_confidence_cut: 0.5
  theme_clusters: 16
  theme_seed: 0
report:
  examples: 10
  decimals: 4
